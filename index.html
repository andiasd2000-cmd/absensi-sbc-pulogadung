<!DOCTYPE html>
<html lang="id">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Absensi SBC Pulogadung — HRIS &amp; Absensi Karyawan</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root{
      --p:#2a3f9e; --d:#1e3a8a; --g:#7d7050;
      --grad:linear-gradient(90deg,var(--p) 0%,var(--p) 45%,var(--g) 100%);
      --ink:#1f2a44; --muted:#7a8194; --line:#e3e7f0; --soft:#f3f5fa;
      --ok:#15803d; --ok-bg:#e8f6ec; --bad:#b91c1c; --bad-bg:#fdecec; --warn:#8a5a00; --warn-bg:#fbf0d9;
    }
    *{box-sizing:border-box}
    html,body{margin:0}
    body{font-family:'Nunito',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:#eef1f7;min-height:100vh}
    a{color:var(--p);text-decoration:none;font-weight:800}
    .hidden{display:none!important}
    .wrap{max-width:480px;margin:0 auto;padding:14px 10px 30px}
    .card{background:#fff;border-radius:20px;padding:18px;box-shadow:0 6px 20px rgba(20,30,80,.07);margin-bottom:14px}
    .sub{font-size:12.5px;color:var(--muted);margin:2px 0 0}
    .center{text-align:center}
    h2{margin:0;font-size:19px;color:var(--d);font-weight:900}
    h3{margin:0 0 4px;font-size:15px;color:var(--d);font-weight:900}
    label{display:block;font-size:11.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:#4b5368;margin:12px 0 6px}
    input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 13px;font:600 14.5px 'Nunito',system-ui,sans-serif;color:var(--ink);outline:none;background:#fff}
    textarea{min-height:80px;resize:vertical}
    input:focus,select:focus,textarea:focus{border-color:#8ea0e6;box-shadow:0 0 0 3px rgba(42,63,158,.12)}
    input[type=checkbox]{width:auto}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;width:100%;border:0;border-radius:12px;padding:14px;font:800 14.5px 'Nunito',system-ui,sans-serif;color:#fff;background:var(--grad);cursor:pointer;margin-top:16px;box-shadow:0 8px 18px rgba(42,63,158,.22)}
    .btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
    .btn.ghost{background:var(--soft);color:var(--ink);border:1px solid var(--line);box-shadow:none}
    .btn.danger{background:#fff;color:var(--bad);border:1px solid #f3c4c4;box-shadow:none}
    .btn.sm{width:auto;padding:9px 13px;font-size:13px;margin-top:0}
    .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .msg{border-radius:12px;padding:11px 13px;font-size:13px;font-weight:700;margin-top:12px}
    .msg.ok{background:var(--ok-bg);color:var(--ok)} .msg.err{background:var(--bad-bg);color:var(--bad)} .msg.info{background:#eaf0ff;color:var(--p)}
    .pill{display:inline-block;border-radius:999px;padding:4px 10px;font-size:11.5px;font-weight:800;white-space:nowrap}
    .pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.mute{background:var(--soft);color:var(--muted)} .pill.info{background:#eaf0ff;color:var(--p)}
    .spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px}
    .spinner.dark{border-color:rgba(0,0,0,.12);border-top-color:var(--p)}
    @keyframes spin{to{transform:rotate(360deg)}}
    svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

    /* ---------- auth ---------- */
    .authbg{max-width:480px;margin:0 auto;border-radius:26px;padding:26px 20px 30px;background:linear-gradient(180deg,#eef1fb 0%,#c9d2f2 18%,var(--p) 60%,#5b5a6e 100%)}
    .authcard{background:#fff;border-radius:24px;padding:26px 22px;box-shadow:0 0 0 1px rgba(201,180,120,.35),0 10px 30px rgba(0,0,0,.12)}
    .logo{width:66px;height:66px;margin:0 auto 10px;border-radius:16px;background:linear-gradient(135deg,var(--p) 35%,var(--g));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:22px;box-shadow:0 8px 20px rgba(201,170,80,.45)}
    .brand{text-align:center;margin-bottom:18px} .brand h1{margin:0;font-size:22px;font-weight:900;color:var(--d)} .brand p{margin:2px 0 0;font-size:13px;color:var(--muted)}
    .tabs{display:flex;gap:8px;margin-bottom:6px}
    .tab{flex:1;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:12px;padding:12px 8px;font:700 14px 'Nunito',system-ui,sans-serif;cursor:pointer}
    .tab.active{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 6px 14px rgba(42,63,158,.3)}
    .hint{text-align:center;font-size:12px;color:var(--muted);margin-top:14px}

    /* ---------- app ---------- */
    .app{max-width:480px;margin:0 auto;background:#fff;border-radius:26px;padding:16px 16px 96px;min-height:calc(100vh - 28px);box-shadow:0 10px 40px rgba(20,30,80,.06)}
    .hdr{display:flex;align-items:center;gap:12px;margin-bottom:14px}
    .avatar{width:44px;height:44px;border-radius:50%;background:#fdf3dc;border:2px solid #e7c873;color:var(--d);font-weight:900;display:flex;align-items:center;justify-content:center;flex:none}
    .avatar.s{width:36px;height:36px;font-size:13px;border-width:1.5px}
    .hello{flex:1;min-width:0} .hello span{font-size:13px;color:var(--muted)} .hello b{display:block;font-size:18px;font-weight:900;color:var(--d);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .iconbtn{position:relative;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.05)}
    .badge{position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:#e11d48;color:#fff;font:800 11px/19px 'Nunito',system-ui,sans-serif;text-align:center;font-style:normal}
    .badge:empty{display:none}
    .shift{border:1.5px solid #d9b968;border-radius:18px;overflow:hidden;background:#eef2fd}
    .shift-top{background:linear-gradient(120deg,var(--p) 0%,var(--p) 55%,var(--g) 100%);color:#fff;text-align:center;padding:14px 12px;font-weight:800;font-size:13.5px}
    .sclock{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:4px;font-size:16px;font-weight:900;letter-spacing:1.5px}
    .shift-body{padding:16px 16px 12px;text-align:center}
    .wt-label{font-size:18px;font-weight:900;letter-spacing:3px;color:var(--d)}
    .wt{font-size:24px;font-weight:800;color:var(--d);margin-top:4px}
    .wt-note{font-size:11.5px;color:#7d86a8;margin-top:2px}
    .gps{display:inline-flex;align-items:center;gap:6px;margin:12px auto 0;border-radius:14px;padding:8px 14px;font-size:12px;font-weight:800;max-width:100%}
    .gps.ok{background:var(--ok-bg);color:var(--ok);border:1px solid #bfe5c9}
    .gps.bad{background:var(--bad-bg);color:var(--bad);border:1px solid #f3c4c4}
    .gps.warn{background:var(--warn-bg);color:var(--warn);border:1px solid #ead29a}
    .gps a{color:inherit;text-decoration:underline}
    .gps svg.i{width:15px;height:15px}
    .cio{display:flex;align-items:center;background:#fff;border-radius:14px;margin-top:14px;box-shadow:0 2px 10px rgba(20,30,80,.08)}
    .cio button{flex:1;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:8px;border:0;background:transparent;padding:14px 6px;font:800 15px 'Nunito',system-ui,sans-serif;color:var(--d);cursor:pointer}
    .cio button:disabled{color:#b5bccd;cursor:not-allowed}
    .cio span{width:1px;height:26px;background:var(--line)}
    .notice{display:flex;align-items:center;justify-content:center;gap:6px;background:#dfe6fb;border-radius:10px;padding:9px 10px;margin-top:12px;font-size:12px;color:#4b5580}
    .notice svg.i{width:15px;height:15px}
    .mapline{display:flex;justify-content:space-between;margin-top:10px;font-size:12px}
    .shift-foot{display:block;background:#fff;text-align:center;padding:14px;font-size:14px;font-weight:800;color:var(--d);border-top:1px solid #ecdcae}
    .map{height:220px;border-radius:14px;overflow:hidden;border:1px solid var(--line);margin-top:10px;z-index:0}
    .sec{display:flex;justify-content:space-between;align-items:center;margin:18px 0 10px} .sec b{font-size:15px} .sec a{font-size:13px}
    .ann{display:flex;gap:12px;background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;border-left:4px solid #d9b968;box-shadow:0 2px 12px rgba(20,30,80,.07)}
    .ann .ico{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--p),#3b4a7a);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
    .ann .ico svg.i{width:18px;height:18px}
    .ann b{font-size:14px} .ann p{margin:3px 0;font-size:12.5px;color:#4b5368;white-space:pre-wrap;word-break:break-word} .ann small{font-size:11px;color:var(--muted)}
    .linkb{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:999px;background:#fbf0d0;border:1px solid #e7c873;color:#6b5414;font-size:10px;font-weight:900;letter-spacing:.4px;vertical-align:2px}
    .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 6px;margin-top:20px;padding-top:18px;border-top:6px solid var(--soft)}
    .tile{display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;cursor:pointer;font-size:11.5px;font-weight:700;color:#3b4258;position:relative;background:none;border:0;padding:0;font-family:'Nunito',system-ui,sans-serif}
    .tile .ti{width:52px;height:52px;border-radius:15px;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 6px 14px rgba(0,0,0,.12)}
    .tile .ti svg.i{width:24px;height:24px}
    .tile .badge{top:-4px;right:calc(50% - 32px)}
    .bnav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -6px 24px rgba(20,30,80,.1);display:flex;padding:8px 6px 10px;z-index:1000}
    .bnav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font:700 11.5px 'Nunito',system-ui,sans-serif;color:#8b93a7;cursor:pointer;position:relative;padding:4px 0}
    .bnav button.active{color:var(--d)}
    .bnav .badge{top:-4px;right:calc(50% - 22px)}
    .subhead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
    .list .row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px dashed var(--line);font-size:13px}
    .list .row:last-child{border-bottom:0}
    .row .l{flex:1;min-width:0} .row .l b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .row .l span{color:var(--muted);font-size:12px}
    .r{text-align:right}
    .kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
    .kpi div{background:var(--soft);border-radius:12px;padding:10px 6px;text-align:center}
    .kpi strong{display:block;font-size:19px;color:var(--d)} .kpi small{font-size:10.5px;color:var(--muted);font-weight:800}
    table{width:100%;border-collapse:collapse;font-size:12.5px}
    th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
    th{font-size:10.5px;text-transform:uppercase;color:var(--muted);letter-spacing:.4px}
    .tablewrap{overflow-x:auto;margin-top:10px}
    .seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
    .seg button{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:7px 12px;font:800 12px 'Nunito',system-ui,sans-serif;color:var(--ink);cursor:pointer}
    .seg button.active{background:var(--p);color:#fff;border-color:var(--p)}
    .check{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-top:8px;font-weight:700;font-size:14px;cursor:pointer}
    .check input{width:18px;height:18px;accent-color:var(--p)}
    .days{display:flex;gap:6px;flex-wrap:wrap}
    .days label{margin:0;text-transform:none;letter-spacing:0;font-size:13px;display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer}
    .editor{background:var(--soft);border-radius:14px;padding:4px 14px 14px;margin:4px 0 10px}
    .rangewrap{display:flex;gap:10px;align-items:center}
    .rangewrap input[type=range]{flex:1;padding:0;border:0;box-shadow:none;accent-color:var(--p)}
    .rangewrap input[type=number]{width:90px}
    .swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:10px}
    .sw{border:2px solid transparent;border-radius:14px;padding:6px;cursor:pointer;background:var(--soft);text-align:center;font:800 11px 'Nunito',system-ui,sans-serif;color:var(--ink)}
    .sw i{display:block;height:36px;border-radius:10px;margin-bottom:5px}
    .sw.active{border-color:var(--ink)}
    .bubble{max-width:82%;padding:9px 12px;border-radius:14px;margin:6px 0;font-size:13.5px;word-break:break-word;white-space:pre-wrap}
    .bubble small{display:block;font-size:10.5px;opacity:.7;margin-bottom:2px;font-weight:800}
    .bubble.me{margin-left:auto;background:var(--p);color:#fff;border-bottom-right-radius:4px}
    .bubble.them{background:var(--soft);border-bottom-left-radius:4px}
    .chatbox{height:calc(100vh - 290px);min-height:280px;overflow-y:auto;padding:4px 2px}
    .chatform{display:flex;gap:8px;margin-top:10px}
    .rank{width:30px;text-align:center;font-weight:900;color:var(--muted);font-size:15px}
    #toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:2000;max-width:90%;pointer-events:none}
    #toast .msg{box-shadow:0 8px 24px rgba(0,0,0,.15)}
  </style>
</head>
<body>

<!-- ===================== HALAMAN DEPAN ===================== -->
<div id="authView" class="wrap hidden">
  <div class="authbg">
    <div class="authcard">
      <div class="brand">
        <div class="logo">SBC</div>
        <h1>Absensi SBC Pulogadung</h1>
        <p>HRIS &amp; Absensi Karyawan</p>
      </div>
      <div class="tabs">
        <button class="tab active" data-tab="login">Masuk</button>
        <button class="tab" data-tab="register" id="tabReg">Daftar (NIP)</button>
      </div>
      <form id="loginForm" autocomplete="on">
        <label for="lNip">User ID / NIP</label>
        <input id="lNip" placeholder="NIP" autocomplete="username" required>
        <label for="lPass">Password</label>
        <input id="lPass" type="password" placeholder="••••••••" autocomplete="current-password" required>
        <button class="btn" type="submit">Masuk</button>
        <div class="hint" id="regHint">Belum punya akun? Ketuk tab <b>Daftar (NIP)</b> di atas.</div>
      </form>
      <form id="registerForm" class="hidden" autocomplete="off">
        <label for="rNip">NIP</label><input id="rNip" placeholder="Nomor Induk Pegawai" required>
        <label for="rNama">Nama Lengkap</label><input id="rNama" placeholder="Nama sesuai KTP" required>
        <label for="rJabatan">Jabatan / Divisi</label><input id="rJabatan" placeholder="mis. Staff Gudang">
        <label for="rHp">No. HP</label><input id="rHp" inputmode="tel" placeholder="08xxxxxxxxxx">
        <label for="rPass">Password</label><input id="rPass" type="password" placeholder="Minimal 6 karakter" required>
        <label for="rPass2">Ulangi Password</label><input id="rPass2" type="password" placeholder="Ketik ulang password" required>
        <button class="btn" type="submit">Daftar</button>
        <div class="hint">Sudah punya akun? Ketuk tab <b>Masuk</b>.</div>
      </form>
      <div id="authMsg"></div>
    </div>
  </div>
</div>

<!-- ======================== APLIKASI ======================== -->
<div id="appView" class="wrap hidden">
  <div class="app"><main id="main"></main></div>
  <nav class="bnav" id="bnav">
    <button data-nav="home"><svg class="i" viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>Home</button>
    <button data-nav="employees" data-menu="employees"><svg class="i" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Employees</button>
    <button data-nav="chat" data-menu="chat"><svg class="i" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Chat<i class="badge" id="chatBadge"></i></button>
    <button data-nav="riwayat"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>Riwayat</button>
    <button data-nav="account"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg>Account</button>
  </nav>
</div>

<div id="bootView" class="wrap"><div class="authbg"><div class="authcard center"><div class="logo">SBC</div><p class="sub">Memuat Absensi SBC Pulogadung…</p></div></div></div>

/* ------------------------------ util ------------------------------ */
function $(id){ return document.getElementById(id); }
function show(el,on){ if(el) el.classList.toggle('hidden',!on); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];}); }
function store(k,v){ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,v);}catch(e){} }
function load(k){ try{ return localStorage.getItem(k);}catch(e){ return null; } }
function msgHtml(type,text){ return text?'<div class="msg '+type+'">'+esc(text)+'</div>':''; }
function setMsg(id,type,text){ var el=$(id); if(el) el.innerHTML=msgHtml(type,text); }
function cleanErr(e){ return String((e&&e.message)||e||'Terjadi kesalahan').replace(/^(Error|Exception):\s*/,''); }
var LOADING='<p class="sub center"><span class="spinner dark"></span> Memuat…</p>';
function empty(t){ return '<p class="sub center" style="padding:14px 0">'+esc(t)+'</p>'; }
function hm(t){ return String(t||'').slice(0,5); }
function wibNow(opt){ return new Date().toLocaleString('en-GB',Object.assign({timeZone:'Asia/Jakarta',hour12:false},opt)); }
function todayStr(){ return new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Jakarta'}); }
function curMonth(){ return todayStr().slice(0,7); }
function nowHM(){ return wibNow({hour:'2-digit',minute:'2-digit'}); }
function parseD(s){ var p=String(s).split('-'); return new Date(Date.UTC(+p[0],+p[1]-1,+p[2],5)); }
function fmtD(s,long){ if(!/^\d{4}-\d{2}-\d{2}/.test(s)) return s; return parseD(s).toLocaleDateString('id-ID',{timeZone:'Asia/Jakarta',weekday:long?'long':'short',day:'numeric',month:long?'long':'short',year:'numeric'}); }
function initial(n){ return esc(String(n||'?').trim().charAt(0).toUpperCase()); }

function toast(text,type){ $('toast').innerHTML=msgHtml(type||'ok',text); clearTimeout(toast.t); toast.t=setTimeout(function(){ $('toast').innerHTML=''; },3500); }
function statusPill(st){
  var c={'Tepat Waktu':'ok','Normal':'ok','Terlambat':'bad','Pulang Cepat':'warn','Lembur':'info','Menunggu':'warn','Disetujui':'ok','Ditolak':'bad','Izin':'info','Cuti':'info','Sakit':'warn','Lainnya':'info'}[st]||'mute';
  return '<span class="pill '+c+'">'+esc(st||'-')+'</span>';

function busy(btn,on,label){
  if(!btn) return;
  if(on){ btn.dataset.label=btn.innerHTML; btn.disabled=true; btn.innerHTML='<span class="spinner'+(btn.classList.contains('ghost')||btn.classList.contains('danger')||btn.closest('.cio')?' dark':'')+'"></span> '+(label||'Memproses…'); }
  else { btn.innerHTML=btn.dataset.label||btn.innerHTML; btn.disabled=false; }
}
function distance(a,b,c,d){ var R=6371000,r=function(x){return x*Math.PI/180;}; var x=r(c-a),y=r(d-b); var h=Math.sin(x/2)*Math.sin(x/2)+Math.cos(r(a))*Math.cos(r(c))*Math.sin(y/2)*Math.sin(y/2); return 2*R*Math.atan2(Math.sqrt(h),Math.sqrt(1-h)); }
function applyTheme(name){ var t=THEMES[name]||THEMES.biru, s=document.documentElement.style; s.setProperty('--p',t.p); s.setProperty('--d',t.d); s.setProperty('--g',t.g); }

/* ------------------------------ API ------------------------------ */
function api(action,payload){
  return new Promise(function(resolve,reject){
    function done(r){
      if(!r) return reject(new Error('Tidak ada respons dari server.'));
      if(r.ok) return resolve(r.data);
      if(r.error==='SESI_HABIS'){ sessionExpired(); return reject(new Error('Sesi berakhir, silakan masuk lagi.')); }
      reject(new Error(r.error));
    }
    if(IN_GAS){
      google.script.run.withSuccessHandler(done).withFailureHandler(function(e){ reject(new Error(cleanErr(e))); })
        .api(S.token,action,payload||{});
    } else {
      if(!API_URL) return reject(new Error('API_URL belum diisi di Index.html.'));
      fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:S.token,action:action,payload:payload||{}})})
        .then(function(r){ return r.json(); }).then(done)
        .catch(function(){ reject(new Error('Gagal terhubung ke server. Periksa internet.')); });
    }
  });
}

/* ------------------------------ GPS ------------------------------ */
function startGeo(){
  if(!navigator.geolocation){ S.geoErr='unsupported'; updateGeo(); return; }
  if(S.watchId!=null) return;
  S.watchId=navigator.geolocation.watchPosition(onPos,onGeoErr,{enableHighAccuracy:true,maximumAge:5000,timeout:20000});
}
function restartGeo(){
  if(S.watchId!=null&&navigator.geolocation) navigator.geolocation.clearWatch(S.watchId);
  S.watchId=null; S.geoErr=null; updateGeo(); startGeo();
}
function onPos(p){ S.pos={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy,t:Date.now()}; S.geoErr=null; updateGeo(); drawHomeMap(); }
function onGeoErr(e){ S.geoErr=e.code===1?'denied':e.code===3?'timeout':'unavailable'; updateGeo(); }
function freshPos(){
  return new Promise(function(resolve,reject){
    if(S.pos&&Date.now()-S.pos.t<15000) return resolve(S.pos);   // posisi pantauan GPS masih segar
    if(!navigator.geolocation) return reject(new Error('Perangkat tidak mendukung GPS.'));
    navigator.geolocation.getCurrentPosition(function(p){ onPos(p); resolve(S.pos); },
      function(e){ onGeoErr(e); reject(new Error(geoErrText())); },{enableHighAccuracy:true,maximumAge:10000,timeout:15000});
  });
}
function geoErrText(){
  if(S.geoErr==='denied') return IN_GAS?'GPS diblokir di dalam frame Apps Script. Gunakan Mode Penuh.':'Izin lokasi ditolak. Izinkan akses lokasi di pengaturan browser.';
  if(S.geoErr==='timeout') return 'Waktu habis mencari lokasi. Coba lagi di area terbuka.';
  if(S.geoErr==='unsupported') return 'Perangkat tidak mendukung GPS.';
  return 'Lokasi tidak tersedia. Pastikan GPS aktif.';
}
function updateGeo(){
  var el=$('gps'); if(!el||!S.home) return;
  var g=S.home.geo, d=S.home, can=false, cls='warn', html;
  if(S.geoErr){
    cls=S.geoErr==='denied'&&IN_GAS?'warn':'bad';
    if(S.geoErr==='denied'&&IN_GAS){
      html=FULL_MODE_URL?'<a href="'+esc(fullModeLink())+'" target="_blank" rel="noopener">GPS diblokir frame — ketuk: Buka Mode Penuh ↗</a>'
                        :'GPS diblokir frame — minta admin mengaktifkan Mode Penuh';
    } else html=esc(geoErrText());
  } else if(!S.pos){ html='Mencari lokasi…'; }
  else {
    var dist=Math.round(distance(S.pos.lat,S.pos.lng,g.lat,g.lng)), acc=Math.round(S.pos.acc||0);
    if(acc>g.maxAccuracy){ html='Sinyal GPS lemah (±'+acc+' m) · '+dist+' m dari titik'; }
    else if(dist<=g.radius){ cls='ok'; can=true; html='Dalam radius · '+dist+' m dari '+esc(g.name)+' (maks '+g.radius+' m)'; }
    else { cls='bad'; html='Di luar radius · '+dist+' m dari '+esc(g.name)+' (maks '+g.radius+' m)'; }
  }
  el.className='gps '+cls; el.innerHTML=ic('pin')+'<span>'+html+'</span>';
  var early=!d.masuk&&nowHM()<d.work.mulai;
  var bIn=$('bIn'), bOut=$('bOut');
  if(bIn&&!bIn.querySelector('.spinner')){
    bIn.disabled=!can||!!d.masuk||early||!!d.izinHariIni;
    bIn.innerHTML=ic('login')+'<span>'+(d.masuk?'Clock In ✓ '+esc(hm(d.masuk.jam)):'Clock In')+'</span>';
  }
  if(bOut&&!bOut.querySelector('.spinner')){
    bOut.disabled=!can||!d.masuk||!!d.pulang||!!d.izinHariIni;

P.chat=function(m){

  S.chatMsgs=[]; S.chatLastId=0; loadChat(true);
  S.chatTimer=setInterval(function(){ loadChat(false); },4000);
  $('chatForm').onsubmit=function(e){
    e.preventDefault(); var t=$('chatIn').value.trim(); if(!t) return;
    var b=this.querySelector('button'); busy(b,true,'');
    api('chatSend',{text:t}).then(function(){ $('chatIn').value=''; loadChat(false); })
      .catch(function(err){ toast(err.message,'err'); }).then(function(){ busy(b,false); });
  };

function loadChat(first){
  if(S.chatBusy) return; S.chatBusy=true;
  api('chatList',{after:first?0:S.chatLastId}).then(function(rows){
    rows=rows.filter(function(r){ return r.id>S.chatLastId; });
    if(rows.length||first){
      S.chatMsgs=S.chatMsgs.concat(rows);
      if(S.chatMsgs.length) S.chatLastId=S.chatMsgs[S.chatMsgs.length-1].id;
      renderChat();
    }
    store('sbc_chat_seen',String(S.chatLastId)); S.chatUnread=0; updateBadges();
  }).catch(function(e){ var b=$('chatBox'); if(b&&first) b.innerHTML=msgHtml('err',e.message); })
    .then(function(){ S.chatBusy=false; });
}
function renderChat(){
  var box=$('chatBox'); if(!box) return;
  var atBottom=box.scrollHeight-box.scrollTop-box.clientHeight<60;
  box.innerHTML=S.chatMsgs.length?S.chatMsgs.map(function(c){
    var me=S.user&&c.nip===S.user.nip;
    return '<div class="bubble '+(me?'me':'them')+'"><small>'+(me?'Anda':esc(c.nama))+' · '+esc(String(c.waktu).slice(11,16))+'</small>'+esc(c.pesan)+'</div>';
  }).join(''):empty('Belum ada pesan. Mulai obrolan!');
  if(atBottom||box.dataset.init!=='1'){ box.scrollTop=box.scrollHeight; box.dataset.init='1'; }
}
function stopChat(){ clearInterval(S.chatTimer); S.chatTimer=null; }
function initChatBadge(){
  if(!menuOn('chat')&&S.home) return;
  api('chatList',{after:0}).then(function(rows){
    var seen=Number(load('sbc_chat_seen')||0);
    var last=rows.length?rows[rows.length-1].id:0;
    if(!seen){ store('sbc_chat_seen',String(last)); seen=last; }
    S.chatLastId=last;
    S.chatUnread=rows.filter(function(r){ return r.id>seen&&(!S.user||r.nip!==S.user.nip); }).length;
    updateBadges();
  }).catch(function(){});
}
function pollChatBadge(){
  if(!S.token||!menuOn('chat')) return;
  api('chatList',{after:S.chatLastId}).then(function(rows){
    if(!rows.length) return;
    S.chatLastId=rows[rows.length-1].id;
    S.chatUnread+=rows.filter(function(r){ return !S.user||r.nip!==S.user.nip; }).length;
    updateBadges();
  }).catch(function(){});
}

/* ---------- Geofencing ---------- */
P.geo=function(m){
  var pg=page(m,'Geofencing','Titik lokasi absen & radius (maks. 200 m)'); pg.innerHTML=LOADING;
  api('adminCfg').then(function(c){
    var g=c.geo;
    pg.innerHTML=
      '<p class="sub">Ketuk peta atau geser penanda untuk memindahkan titik.</p><div id="gMap" class="map" style="height:280px"></div>'+
      '<label>Nama Lokasi</label><input id="gName" value="'+esc(g.name)+'">'+
      '<div class="row2"><div><label>Latitude</label><input id="gLat" inputmode="decimal" value="'+g.lat.toFixed(6)+'"></div><div><label>Longitude</label><input id="gLng" inputmode="decimal" value="'+g.lng.toFixed(6)+'"></div></div>'+
      '<label>Radius (meter)</label><div class="rangewrap"><input type="range" id="gR" min="'+g.minRadius+'" max="'+g.maxRadius+'" step="5" value="'+g.radius+'"><input type="number" id="gRn" min="'+g.minRadius+'" max="'+g.maxRadius+'" value="'+g.radius+'"></div>'+
      '<div class="row2"><button class="btn ghost" id="gMe">'+ic('pin')+' Lokasi saya</button><button class="btn" id="gSave">Simpan Titik</button></div>'+
      '<p class="sub" id="gInfo" style="margin-top:10px">'+(g.updatedAt?'Terakhir diubah '+esc(g.updatedAt)+' oleh '+esc(g.updatedBy):'Titik masih bawaan — silakan tentukan titik kantor yang benar.')+'</p><div id="gMsg"></div>';
    if(typeof L==='undefined'){ setMsg('gMsg','err','Peta gagal dimuat. Isi latitude/longitude manual.'); }
    else {
      S.mapA=L.map('gMap').setView([g.lat,g.lng],17);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(S.mapA);
      var mk=L.marker([g.lat,g.lng],{draggable:true}).addTo(S.mapA);
      var cc=L.circle([g.lat,g.lng],{radius:g.radius,color:'#2a3f9e',weight:2,fillOpacity:.12}).addTo(S.mapA);
      var setPt=function(lat,lng,pan){ if(!isFinite(lat)||!isFinite(lng)) return; $('gLat').value=(+lat).toFixed(6); $('gLng').value=(+lng).toFixed(6); mk.setLatLng([lat,lng]); cc.setLatLng([lat,lng]); if(pan) S.mapA.panTo([lat,lng]); };
      mk.on('drag',function(e){ var p=e.target.getLatLng(); setPt(p.lat,p.lng,false); });
      S.mapA.on('click',function(e){ setPt(e.latlng.lat,e.latlng.lng,false); });
      $('gLat').onchange=$('gLng').onchange=function(){ setPt(+$('gLat').value,+$('gLng').value,true); };
      var setR=function(v){ v=Math.round(+v); if(!isFinite(v)) return; var c2=Math.min(g.maxRadius,Math.max(g.minRadius,v)); $('gR').value=c2; if(v>g.maxRadius){ $('gRn').value=g.maxRadius; setMsg('gMsg','info','Radius maksimal '+g.maxRadius+' meter.'); } cc.setRadius(c2); };
      $('gR').oninput=function(){ $('gRn').value=this.value; setR(this.value); };
      $('gRn').oninput=function(){ setR(this.value); };
      $('gMe').onclick=function(){ var b=this; busy(b,true,'Mencari…'); freshPos().then(function(p){ setPt(p.lat,p.lng,true); S.mapA.setZoom(18); setMsg('gMsg','info','Titik dipindah ke lokasi Anda (akurasi ±'+Math.round(p.acc)+' m). Ketuk Simpan Titik.'); }).catch(function(e){ setMsg('gMsg','err',e.message); }).then(function(){ busy(b,false); }); };
      setTimeout(function(){ if(S.mapA){ S.mapA.invalidateSize(); S.mapA.fitBounds(cc.getBounds().pad(.4)); } },150);
    }
    $('gSave').onclick=function(){
      var r=Math.round(+$('gRn').value);
      if(!(r>=g.minRadius&&r<=g.maxRadius)){ setMsg('gMsg','err','Radius harus antara '+g.minRadius+' dan '+g.maxRadius+' meter.'); return; }
      var b=this; busy(b,true);
      api('geoSave',{name:$('gName').value,lat:$('gLat').value,lng:$('gLng').value,radius:r}).then(function(ng){
        if(S.home) S.home.geo=ng;
        $('gInfo').textContent='Terakhir diubah '+ng.updatedAt+' oleh '+ng.updatedBy;
        setMsg('gMsg','ok','Titik lokasi tersimpan dan langsung berlaku untuk semua karyawan.');
      }).catch(function(e){ setMsg('gMsg','err',e.message); }).then(function(){ busy(b,false); });
    };
  }).catch(function(e){ pg.innerHTML=msgHtml('err',e.message); });
};

        catch(e){ setMsg('rMsg','err','Unduhan diblokir browser. Gunakan Ekspor ke Sheets.'); }
      };
      $('rXls').onclick=function(){ var b2=this; busy(b2,true,'Membuat…'); api('rekapExport',{from:last.from,to:last.to}).then(function(r){ $('rMsg').innerHTML='<div class="msg ok">File dibuat: <a href="'+esc(r.url)+'" target="_blank" rel="noopener">'+esc(r.name)+' ↗</a></div>'; }).catch(function(e){ setMsg('rMsg','err',e.message); }).then(function(){ busy(b2,false); }); };
    }).catch(function(e){ $('rOut').innerHTML=msgHtml('err',e.message); }).then(function(){ busy(b,false); });
  };
};

/* ---------- Riwayat Absen (semua) ---------- */
P.riwayatAdmin=function(m){
  var pg=page(m,'Riwayat Absen','Semua catatan absensi');
  var t=todayStr();
  pg.innerHTML='<div class="row2"><div><label>Dari</label><input type="date" id="hF" value="'+t+'"></div><div><label>Sampai</label><input type="date" id="hT" value="'+t+'"></div></div>'+
    '<label>Karyawan</label><select id="hN"><option value="">Semua karyawan</option></select><button class="btn" id="hGo">Tampilkan</button><div id="hOut"></div>';
  api('usersList').then(function(u){ $('hN').innerHTML+=u.map(function(x){ return '<option value="'+esc(x.nip)+'">'+esc(x.nama)+' ('+esc(x.nip)+')</option>'; }).join(''); }).catch(function(){});
  function run(){
    var b=$('hGo'); busy(b,true);
    api('riwayatAll',{from:$('hF').value,to:$('hT').value,nip:$('hN').value}).then(function(d){
      $('hOut').innerHTML='<p class="sub" style="margin-top:12px">'+d.total+' catatan'+(d.total>500?' (menampilkan 500 terbaru)':'')+'</p><div class="tablewrap"><table><thead><tr><th>Waktu</th><th>Nama</th><th>Jenis</th><th>Status</th><th>Jarak</th></tr></thead><tbody>'+
        d.rows.map(function(x){
          if(x.jenis==='Izin') return '<tr style="background:#f3f6ff"><td>'+esc(fmtD(x.tanggal))+'</td><td>'+esc(x.nama)+'</td><td>'+esc(x.status)+'</td><td>'+statusPill(x.status)+'<br><span class="sub">'+esc(x.keterangan||'')+'</span></td><td>-</td></tr>';
          return '<tr><td>'+esc(fmtD(x.tanggal))+'<br><span class="sub">'+esc(x.jam)+'</span></td><td>'+esc(x.nama)+'</td><td>'+(x.jenis==='Masuk'?'In':'Out')+'</td><td>'+statusPill(x.status)+'</td><td>'+(x.otomatis?'Otomatis':esc(x.jarak)+' m')+'</td></tr>'; }).join('')+
        '</tbody></table></div>'+(d.rows.length?'':empty('Tidak ada catatan.'));
    }).catch(function(e){ $('hOut').innerHTML=msgHtml('err',e.message); }).then(function(){ busy(b,false); });
  }
  $('hGo').onclick=run; run();
};

/* ------------------------------ START ------------------------------ */
(function boot(){
  var h=location.hash.match(/[#&]t=([^&]+)/);
  if(h){ store(TOKEN_KEY,decodeURIComponent(h[1])); try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){} }
  S.token=load(TOKEN_KEY);
  api('config').then(function(c){ S.cfg=c; applyTheme(c.theme); }).catch(function(){})
    .then(function(){
      if(!S.token){ showAuth(); return; }
      api('home').then(function(d){ S.home=d; S.user=d.user; applyTheme(d.theme); refreshNav(); enterApp(); })
        .catch(function(){ resetSession(); showAuth(); });
    });
})();
})();
</script>
